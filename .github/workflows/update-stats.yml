name: Update language stats

on:
  schedule:
    - cron: '30 */6 * * *'   # every 6h — surface new merged PRs fast
  workflow_dispatch:        # manual trigger via Actions tab

permissions:
  contents: write           # push back the refreshed SVG

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install cloc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cloc

      - name: Regenerate languages.svg + stats.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_READ_PAT }}
        run: python3 gen-stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- languages.svg stats.svg README.md; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add languages.svg stats.svg README.md
          git commit -m "chore(stats): refresh stats + contributions $(date -u +%Y-%m-%d)"
          git push
