name: Update language stats

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST daily (03:30 UTC)
  workflow_dispatch:        # manual trigger via Actions tab

permissions:
  contents: write           # push back the refreshed SVG

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate languages.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_READ_PAT }}
        run: python3 gen-stats.py languages.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- languages.svg; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add languages.svg
          git commit -m "chore(stats): refresh language stats $(date -u +%Y-%m-%d)"
          git push
